name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
# Keeps Actions minutes low: one run per change, drafts skipped, a timeout.
# The leak check runs in its own workflow (leak-check.yml) on every change, docs included.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Docs-only pull requests skip the tests. A skipped job still passes the required check (branch protection, D205,
  # 2026-11-15). If this job fails, the tests run anyway, so a broken gate can't let a merge through.
  changes:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -qvE '\.md$|^docs/|^LICENSE$' <<<"$files"; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
  test:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && needs.changes.outputs.code != 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: hashFiles('package.json') != ''
        with:
          node-version: 24
          cache: npm
      # Until the code lands (after tour v3) the repo holds only docs: skip rather than fail.
      - run: npm ci
        if: hashFiles('package.json') != ''
      - run: npm run typecheck
        if: hashFiles('package.json') != ''
      - run: npm test
        if: hashFiles('package.json') != ''
      - run: npm run build
        if: hashFiles('package.json') != ''
